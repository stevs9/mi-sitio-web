<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Universitario</title>
</head>
<body>
    <header>
        <h1>Registro de Estudiantes</h1>
        <p>Complete el siguiente formulario.</p>
    </header>

    <main>
        <form>
            <section>
                <h2>Información Personal</h2>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>
                <br><br>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>
                <br><br>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono">
                <br><br>

                <label for="fecha">Fecha de nacimiento:</label>
                <input type="date" id="fecha" name="fecha" required>
                <br><br>

                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="16" max="100">
                <br><br>

                <!-- Mejora 1: Sitio web personal -->
                <label for="web">Sitio web personal:</label>
                <input type="url" id="web" name="web" placeholder="https://ejemplo.com">
                <br><br>

                <!-- Mejora 2: Color favorito -->
                <label for="color_favorito">Color favorito:</label>
                <input type="color" id="color_favorito" name="color_favorito" value="#0000ff">
                <br><br>

                <!-- Mejora 5: Cargar fotografía -->
                <label for="foto">Fotografía de perfil:</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </section>

            <section>
                <h2>Información Académica</h2>
                <label for="carrera">Carrera:</label>
                <select id="carrera" name="carrera" required>
                    <option value="">Seleccione una carrera</option>
                    <option value="sistemas">Ingeniería de Sistemas</option>
                    <option value="software">Ingeniería de Software</option>
                    <option value="informatica">Licenciatura en Informática</option>
                    <option value="redes">Ingeniería de Redes</option>
                </select>
                <br><br>

                <label for="semestre">Semestre:</label>
                <input type="number" id="semestre" name="semestre" min="1" max="12" required>
                <br><br>
                <p>Modalidad:</p>
                <input type="radio" id="presencial" name="modalidad" value="presencial" required>
                <label for="presencial">Presencial</label>
                <input type="radio" id="virtual" name="modalidad" value="virtual">
                <label for="virtual">Virtual</label>
                <input type="radio" id="hibrida" name="modalidad" value="hibrida">
                <label for="hibrida">Híbrida</label>

                <p>Lenguajes que conoce:</p>
                <input type="checkbox" id="html" name="lenguajes" value="html">
                <label for="html">HTML</label>
                <input type="checkbox" id="css" name="lenguajes" value="css">
                <label for="css">CSS</label>
                <input type="checkbox" id="javascript" name="lenguajes" value="javascript">
                <label for="javascript">JavaScript</label>
            </section>

            <section>
                <h2>Información Adicional</h2>
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion" placeholder="Ingrese su dirección">
                <br><br>

                <!-- Mejora 3: Nivel de satisfacción -->
                <label for="satisfaccion">Nivel de satisfacción previo (1 al 10):</label>
                <input type="range" id="satisfaccion" name="satisfaccion" min="1" max="10">
                <br><br>

                <label for="comentarios">Comentarios:</label><br>
                <textarea id="comentarios" name="comentarios" rows="5" cols="40" placeholder="Escriba sus comentarios"></textarea>
                <br><br>
  <h2>Información agregada</h2>

                <!-- Mejora 4: Términos y condiciones obligatorios -->
                <input type="checkbox" id="terminos" name="terminos" required>
                <label for="terminos">Acepto los términos y condiciones</label>
            </section>
            <br>

            <button type="submit">Registrar estudiante</button>
            <button type="reset">Limpiar formulario</button>
        </form>
    </main>

    <footer>
        <p>Taller práctico de HTML5</p>
    </footer>
</body>
</html>
